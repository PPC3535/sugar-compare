name: Update sugar data

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless browser
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Fetch prices from Barchart
        run: python scripts/update_data.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data; then
            echo "No new data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update sugar prices ($(date -u +%Y-%m-%d))"
          git push
